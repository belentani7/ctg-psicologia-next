name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Calidad, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Node.js (versión de .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Archivos de gobernanza
        run: |
          for f in README.md LICENSE .gitignore CODE_OF_CONDUCT.md CONTRIBUTING.md SECURITY.md; do
            test -f "$f" || { echo "Falta $f"; exit 1; }
          done

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Banco de datos
        run: npm run catalog:check

      - name: Tests (Node)
        run: npm test

      - name: Tests (Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v

      - name: Build
        run: npm run build

      - name: Accesibilidad (axe-core sobre el HTML construido)
        run: npm run audit:a11y

      - name: Informe de accesibilidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: a11y-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Humo HTTP (servidor standalone)
        run: npm run smoke
